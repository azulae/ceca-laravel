name: run-tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 9 (PHP 8.1 / 8.2)
          - php: '8.1'
            laravel: ^9.0
            testbench: ^7.0
          - php: '8.2'
            laravel: ^9.0
            testbench: ^7.0
          # Laravel 10 (PHP 8.1 - 8.3)
          - php: '8.1'
            laravel: ^10.0
            testbench: ^8.0
          - php: '8.2'
            laravel: ^10.0
            testbench: ^8.0
          - php: '8.3'
            laravel: ^10.0
            testbench: ^8.0
          # Laravel 11 (PHP 8.2 - 8.4)
          - php: '8.2'
            laravel: ^11.0
            testbench: ^9.0
          - php: '8.3'
            laravel: ^11.0
            testbench: ^9.0
          - php: '8.4'
            laravel: ^11.0
            testbench: ^9.0
          # Laravel 12 (PHP 8.2 - 8.4)
          - php: '8.2'
            laravel: ^12.0
            testbench: ^10.0
          - php: '8.3'
            laravel: ^12.0
            testbench: ^10.0
          - php: '8.4'
            laravel: ^12.0
            testbench: ^10.0
          # Laravel 13 (PHP 8.3 / 8.4)
          - php: '8.3'
            laravel: ^13.0
            testbench: ^11.0
          - php: '8.4'
            laravel: ^13.0
            testbench: ^11.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, openssl, hash
          coverage: none

      - name: Install dependencies
        run: |
          # Las versiones antiguas de Laravel pueden tener avisos de seguridad
          # no backporteados; no deben bloquear la matriz de tests del paquete.
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
